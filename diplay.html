<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display type example</title>
   <style>
    .inline-element {
        display: inline;
        background-color: lightblue;
        padding: 10px;
        margin: 5px;
    }

    .block-element {
        display: block;
        background-color: lightgreen;
        padding: 10px;
        margin: 5px;
    }
</style>
</head>

</head>
<body>
    <h1>Display Type Example</h1>
    <p>This example demonstrates the difference between inline and block display types.</p>

    <div class="inline-element">Inline Element 1</div>
    <div class="inline-element">Inline Element 2</div>
    <div class="inline-element">Inline Element 3</div>

    <div class="block-element">Block Element 1</div>
    <div class="block-element">Block Element 2</div>
    <div class="block-element">Block Element 3</div>

</body>
</html>
